# The world of the synthetic corpus (data-model §9, FR-041).
#
# Every organization, person and identifier here is fictional. The one
# exception is a public authority named as the issuer of a public legal
# document, with that document's code. Emails use the .example domain.
#
# An entry's `name` is how its own documents write it; `labels` say how a
# generated question in each language names it, and default to `name`.
# Attribute values are plain strings, checked against enterprise-docs.

