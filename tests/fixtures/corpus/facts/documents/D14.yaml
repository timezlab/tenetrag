  - paragraph: "Đơn vị ban hành: Phòng Tài chính / Issued by: Finance Department"
  - paragraph: "Mã: HD-TC-01. Ban hành ngày 20/01/2026, có hiệu lực từ ngày 01/02/2026. / Code: HD-TC-01. Issued on 20 January 2026, effective from 1 February 2026."
  - paragraph: "Hướng dẫn này thực hiện Quy chế công tác phí phiên bản 2 và căn cứ Thông tư 40/2017/TT-BTC của Bộ Tài chính."
  - paragraph: "This guidance implements version 2 of the travel expense policy and follows Circular 40/2017/TT-BTC of the Ministry of Finance."
  - paragraph: "Thời hạn nộp hồ sơ thanh toán công tác phí là 10 ngày làm việc sau chuyến công tác."
  - paragraph: "The deadline for submitting expense claims is 10 working days after the trip."
