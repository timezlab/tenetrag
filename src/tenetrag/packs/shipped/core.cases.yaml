# Identity cases for the shipped `core` pack (data-model §8, research R11).
# The 22 design cases of ADR 0016, converted from
# specs/002-packs-and-corpus/research/identity-design-cases.json, and 5 added
# so that every key, veto and scoped type of `core` is tested (FR-031).
# Edited by hand from here on; test_design_cases_match_snapshot keeps the
# design cases true to the snapshot. Fictional names and .example emails
# only (FR-041); the one real name is the public issuer of a legal code.
pack: core
entities:
  alpha:
    type: Organization
    name: Công ty CP Alpha
    attributes:
      category: {value: company, quote: Công ty CP Alpha}
      registration_id: {value: "0101234567", quote: mã số doanh nghiệp 0101234567}
  delta:
    type: Organization
    name: Công ty CP Delta
    attributes:
      category: {value: company, quote: Công ty CP Delta}
      registration_id: {value: "0105550001", quote: mã số doanh nghiệp 0105550001}
  beta:
    type: Organization
    name: Công ty CP Beta
    attributes:
      category: {value: company, quote: Công ty CP Beta}
  nhnn:
    type: Organization
    name: Ngân hàng Nhà nước Việt Nam
    attributes:
      category: {value: government_agency, quote: Ngân hàng Nhà nước Việt Nam}
  alpha.cnhn:
    type: Organization
    name: Chi nhánh Hà Nội
    scope: alpha
    attributes:
      category: {value: unit, quote: Chi nhánh Hà Nội}
      registration_id: {value: 0101234567-001, quote: mã số doanh nghiệp 0101234567-001}
  alpha.tc:
    type: Organization
    name: Phòng Tài chính
    scope: alpha
    attributes:
      category: {value: unit, quote: Phòng Tài chính}
  alpha.dt:
    type: Organization
    name: Phòng Đầu tư
    scope: alpha
    attributes:
      category: {value: unit, quote: Phòng Đầu tư}
      established_on: {value: "2019-03-01", quote: thành lập ngày 01/03/2019}
  alpha.cntt:
    type: Organization
    name: Phòng Công nghệ thông tin
    scope: alpha
    attributes:
      category: {value: unit, quote: Phòng Công nghệ thông tin}
  alpha.kh:
    type: Organization
    name: Phòng Kế hoạch
    scope: alpha
    attributes:
      category: {value: unit, quote: Phòng Kế hoạch}
  an.alpha:
    type: Person
    name: Nguyễn Văn An
    relations:
      - {type: MEMBER_OF, to: alpha.tc}
      - type: HOLDS_POSITION
        to: alpha.tc
        attributes:
          title: {value: Trưởng phòng, quote: Trưởng phòng Nguyễn Văn An}
  binh:
    type: Person
    name: Trần Thị Bình
    attributes:
      email: {value: binh.tt@alpha.example, quote: email binh.tt@alpha.example}
    relations:
      - {type: MEMBER_OF, to: alpha.tc}
      - type: HOLDS_POSITION
        to: alpha.tc
        attributes:
          title: {value: Phó phòng, quote: Phó phòng Trần Thị Bình}
  minh:
    type: Person
    name: Lê Minh
    attributes:
      email: {value: minh.le@alpha.example, quote: email minh.le@alpha.example}
    relations:
      - {type: MEMBER_OF, to: alpha}
  ha:
    type: Person
    name: Đỗ Thị Hà
    attributes:
      born_on: {value: "1980-05-20", quote: sinh ngày 20/05/1980}
    relations:
      - {type: MEMBER_OF, to: alpha.tc}
  thu:
    type: Person
    name: Vũ Minh Thư
    attributes:
      email: {value: taichinh@alpha.example, quote: email taichinh@alpha.example}
    relations:
      - {type: MEMBER_OF, to: alpha.tc}
  w.tt39:
    type: Work
    name: Thông tư 39/2016/TT-NHNN
