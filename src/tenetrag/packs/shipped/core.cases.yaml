      title: {value: Hợp đồng cung cấp dịch vụ, quote: Hợp đồng cung cấp dịch vụ}
  w.ar:
    type: Work
    name: Báo cáo thường niên
    scope: alpha
    attributes:
      issued_on: {value: "2025-04-15", quote: ban hành ngày 15/04/2025}
