    attributes:
      code: {value: 39/2016/TT-NHNN, quote: số 39/2016/TT-NHNN}
      title: {value: Thông tư 39/2016/TT-NHNN, quote: Thông tư 39/2016/TT-NHNN}
  w.hd.alpha:
    type: Work
    name: Hợp đồng cung cấp dịch vụ
    scope: alpha
    attributes:
