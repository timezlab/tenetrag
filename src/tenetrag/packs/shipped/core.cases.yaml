    type: Place
    name: Xã Tân Phú
    scope: tinh-x
    attributes:
      kind: {value: other, quote: Xã Tân Phú}
  met.npl:
    type: Metric
    name: Tỷ lệ nợ xấu
  con.vip:
    type: Concept
    name: Khách hàng ưu tiên
cases:
  - id: ORG-1
    origin: design
    expect: apart
    title: Tên gần giống, khác mã số DN
    existing: [alpha]
    mention:
      type: Organization
      name: Công ty CP Alpha Holdings
      attributes:
        category: {value: company, quote: Công ty CP Alpha Holdings}
