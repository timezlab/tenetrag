# Identity cases for the shipped `enterprise-docs` pack (data-model §8,
# research R11). The 31 design cases of ADR 0016, converted from
# specs/002-packs-and-corpus/research/identity-design-cases.json, and 12
# added so that every key, veto and scope `enterprise-docs` gives is tested
# (FR-031). Edited by hand from here on; test_design_cases_match_snapshot
# keeps the design cases true to the snapshot. Fictional names and .example
# emails only (FR-041); the one real name is the public issuer of a legal code.
pack: enterprise-docs
